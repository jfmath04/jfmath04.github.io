<!doctype html>
<html>
  <head>
    <title>library</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="collage.css" />
  </head>
  <body>
    <div class="collage">
      <div class="side-left">
        <img
          class="inactive-img"
          src="images/library/occupancy.jpeg"
          title="occupancy permit"
        />
      </div>

      <div class="row">
        <img
          class="inactive-img"
          src="images/library/leftfarcorner.jpeg"
          style="margin-left: 185px"
          title="left far corner"
        />
        <img
          class="inactive-img"
          src="images/library/cabinet.jpeg"
          style="margin-left: 150px"
          title="cabinet"
        />
        <img
          class="inactive-img"
          src="images/library/fan.jpeg"
          style="height: 120px"
          title="fan"
        />
        <img
          class="inactive-img"
          src="images/library/rightfarcorner.jpeg"
          style="margin-left: 10px"
          title="right far corner"
        />
      </div>

      <div class="row">
        <a href="libraryleft.html">
          <img
            class="clickable-img"
            src="images/library/left.jpeg"
            title="library left"
          />
        </a>
        <img
          class="inactive-img"
          src="images/library/pano.jpeg"
          title="panorama"
          style="height: 200px"
        />
        <a href="libraryright.html">
          <img
            class="clickable-img"
            src="images/library/right.jpeg"
            title="library right"
          />
        </a>
      </div>

      <div class="row">
        <img
          class="inactive-img"
          src="images/library/leftnearcorner.jpeg"
          style="margin-left: 185px"
          title="left near corner"
        />
        <a href="hallway.html">
          <img
            class="clickable-img"
            src="images/library/door.jpeg"
            style="margin-left: 90px"
            title="back to hallway"
          />
        </a>
        <img
          class="inactive-img"
          src="images/library/rightnearcorner.jpeg"
          style="margin-left: 85px"
          title="right near corner"
        />
      </div>
    </div>
  </body>
</html>
