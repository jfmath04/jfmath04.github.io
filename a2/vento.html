<!doctype html>
<html>
  <head>
    <title>del vento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="collage.css" />
  </head>
  <body>
    <div class="collage">
      <div class="side-right">
        <img
          class="inactive-img"
          src="images/vento/occupancy.jpeg"
          style="margin-left: 50px"
          title="occupancy permit"
        />
      </div>

      <div class="row">
        <img
          class="inactive-img"
          src="images/vento/farleftcorner.jpeg"
          title="far left corner"
        />
        <img
          class="inactive-img"
          src="images/vento/thing.jpeg"
          style="height: 120px"
          title="thing"
        />
        <img
          class="inactive-img"
          src="images/vento/center.jpeg"
          style="margin-left: 120px"
          title="center"
        />
        <img
          class="inactive-img"
          src="images/vento/farrightcorner.jpeg"
          style="margin-left: 260px"
          title="far right corner"
        />
      </div>

      <div class="row">
        <img class="inactive-img" src="images/vento/left.jpeg" title="left" />
        <img
          class="inactive-img"
          src="images/vento/pano.jpeg"
          title="panorama"
          style="height: 200px"
        />
      </div>

      <div class="row">
        <img
          class="inactive-img"
          src="images/vento/chess.jpeg"
          title="chess board"
        />
        <a href="hallway.html">
          <img
            class="clickable-img"
            src="images/vento/door.jpeg"
            style="margin-left: 250px"
            title="back to hallway"
          />
        </a>
        <img
          class="inactive-img"
          src="images/vento/armchair.jpeg"
          style="height: 120px; margin-left: 150px"
          title="armchair"
        />
        <img
          class="inactive-img"
          src="images/vento/nearrightcorner.jpeg"
          title="near right corner"
        />
      </div>
    </div>
  </body>
</html>
