<!doctype html>
<html>
  <head>
    <title>library right side</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="collage.css" />
  </head>
  <body>
    <div class="collage">
      <div class="side-left">
        <img
          class="inactive-img"
          src="images/library/libraryleft/book.jpeg"
          style="height: 200px; margin-left: -50px"
          title="book"
        />
      </div>
      <div class="row">
        <img
          class="inactive-img"
          src="images/library/libraryright/leftfarcorner.jpeg"
          style="position: relative; margin-left: 0px; top: 90px"
          title="left far corner"
        />
        <img
          class="inactive-img"
          src="images/library/libraryright/fireplace.jpeg"
          style="margin-left: 225px"
          title="fireplace"
        />
        <img
          class="inactive-img"
          src="images/library/libraryright/rightfarcorner.jpeg"
          style="position: relative; margin-left: 225px; top: 90px"
          title="right far corner"
        />
      </div>
      <div class="row">
        <img
          class="inactive-img"
          src="images/library/libraryright/pano.jpeg"
          title="panorama"
          style="height: 250px; margin-left: 170px"
        />
      </div>

      <div class="row">
        <img
          class="inactive-img"
          src="images/library/libraryright/leftnearcorner.jpeg"
          style="position: relative; bottom: 90px"
          title="left near corner"
        />
        <a href="library.html">
          <img
            class="clickable-img"
            src="images/library/libraryright/library.jpeg"
            style="margin-left: 225px"
            title="back to library"
          />
        </a>
        <img
          class="inactive-img"
          src="images/library/libraryright/rightnearcorner.jpeg"
          style="position: relative; margin-left: 225px; bottom: 90px"
          title="right near corner"
        />
      </div>
    </div>
  </body>
</html>
