<!doctype html>
<html>
  <head>
    <title>computer room</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="collage.css" />
  </head>
  <body>
    <div class="collage">
      <div class="side-right">
        <img
          class="inactive-img"
          src="images/computer/occupancy.jpeg"
          style="margin-left: 30px"
          title="occupancy permit"
        />
      </div>

      <div class="row">
        <img
          class="inactive-img"
          src="images/computer/left.jpeg"
          title="left"
        />
        <img
          class="inactive-img"
          src="images/computer/back.jpeg"
          title="back"
        />
        <img
          class="inactive-img"
          style="margin-left: 115px"
          src="images/computer/star.jpeg"
          title="star"
        />
        <img
          class="inactive-img"
          src="images/computer/rightfar.jpeg"
          style="margin-left: 270px"
          title="right far"
        />
      </div>

      <div class="row">
        <img
          class="inactive-img"
          src="images/computer/light.jpeg"
          title="light"
        />
        <img
          class="inactive-img"
          src="images/computer/pano.jpeg"
          title="panorama"
          style="height: 240px"
        />
        <img
          class="inactive-img"
          src="images/computer/right.jpeg"
          title="right"
        />
      </div>

      <div class="row">
        <a href="hallway.html">
          <img
            class="clickable-img"
            src="images/computer/door.jpeg"
            title="back to hallway"
          />
        </a>
        <img
          class="inactive-img"
          src="images/computer/leftfront.jpeg"
          title="left front"
        />
        <img
          class="inactive-img"
          src="images/computer/front.jpeg"
          style="margin-left: 115px"
          title="front"
        />
        <img
          class="inactive-img"
          src="images/computer/printer.jpeg"
          style="margin-left: 170px"
          title="printer"
        />
      </div>
    </div>
  </body>
</html>
