<!doctype html>
<html>
  <head>
    <title>game room</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="collage.css" />
  </head>
  <body>
    <div class="collage">
      <div class="side-left">
        <img
          class="inactive-img"
          src="images/game/occupancy.jpeg"
          style="margin-right: 15px"
          title="occupancy permit"
        />
      </div>

      <div class="row">
        <img
          class="inactive-img"
          src="images/game/pinball.jpeg"
          title="pinball"
        />
        <img
          class="inactive-img"
          src="images/game/dartboard.jpeg"
          style="margin-left: 260px"
          title="dartboard"
        />
        <img
          class="inactive-img"
          src="images/game/rightback.jpeg"
          style="margin-left: 80px"
          title="right back"
        />
        <img
          class="inactive-img"
          src="images/game/foosball.jpeg"
          title="foosball"
        />
      </div>

      <div class="row">
        <img class="inactive-img" src="images/game/left.jpeg" title="left" />
        <img
          class="inactive-img"
          src="images/game/pano.jpeg"
          title="panorama"
          style="height: 250px"
        />
        <img class="inactive-img" src="images/game/right.jpeg" title="right" />
      </div>

      <div class="row">
        <img
          class="inactive-img"
          src="images/game/poolsticks.jpeg"
          title="pool sticks"
        />
        <img
          class="inactive-img"
          src="images/game/leftfront.jpeg"
          title="left front"
        />
        <a href="hallway.html">
          <img
            class="clickable-img"
            src="images/game/door.jpeg"
            style="margin-left: 80px"
            title="back to hallway"
          />
        </a>
        <img
          class="inactive-img"
          src="images/game/cabinet.jpeg"
          style="margin-left: 260px"
          title="cabinet"
        />
      </div>
    </div>
  </body>
</html>
