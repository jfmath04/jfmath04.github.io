<!doctype html>
<html>
  <head>
    <title>library left side</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="collage.css" />
  </head>
  <body>
    <div class="collage">
      <div class="side-right">
        <img
          class="inactive-img"
          src="images/library/libraryleft/book.jpeg"
          style="height: 200px; margin-right: -150px"
          title="book"
        />
      </div>
      <div class="row">
        <img
          class="inactive-img"
          src="images/library/libraryleft/leftfarcorner.jpeg"
          style="position: relative; margin-left: -170px; top: 90px"
          title="left far corner"
        />
        <img
          class="inactive-img"
          src="images/library/libraryleft/frame.jpeg"
          style="margin-left: 210px"
          title="frame"
        />
        <img
          class="inactive-img"
          src="images/library/libraryleft/rightfarcorner.jpeg"
          style="position: relative; margin-left: 210px; top: 90px"
          title="right far corner"
        />
      </div>
      <div class="row">
        <img
          class="inactive-img"
          src="images/library/libraryleft/pano.jpeg"
          title="panorama"
          style="height: 250px"
        />
      </div>

      <div class="row">
        <img
          class="inactive-img"
          src="images/library/libraryleft/leftnearcorner.jpeg"
          style="position: relative; margin-left: -170px; bottom: 90px"
          title="left near corner"
        />
        <a href="library.html">
          <img
            class="clickable-img"
            src="images/library/libraryleft/library.jpeg"
            style="margin-left: 210px"
            title="back to library"
          />
        </a>
        <img
          class="inactive-img"
          src="images/library/libraryleft/rightnearcorner.jpeg"
          style="position: relative; margin-left: 210px; bottom: 90px"
          title="right near corner"
        />
      </div>
    </div>
  </body>
</html>
