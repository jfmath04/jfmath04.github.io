<!doctype html>
<html>
  <head>
    <title>theater</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="collage.css" />
  </head>
  <body>
    <div class="collage">
      <div class="side-left">
        <img
          class="inactive-img"
          src="images/theater/occupancy.jpeg"
          style="margin-right: 80px"
          title="occupancy permit"
        />
      </div>
      <div class="row">
        <img
          class="inactive-img"
          src="images/theater/bear.jpeg"
          title="bear"
          style="
            transform: scale(1.8);
            position: relative;
            top: 120px;
            right: 20px;
          "
        />
        <img
          class="inactive-img"
          src="images/theater/backfarcorner.jpeg"
          style="margin-left: 35px"
          title="back far corner"
        />
        <img
          class="inactive-img"
          src="images/theater/sloth.jpeg"
          style="height: 120px"
          title="sloth"
        />
        <img
          class="inactive-img"
          src="images/theater/window.jpeg"
          style="margin-left: 165px"
          title="window"
        />
        <img
          class="inactive-img"
          src="images/theater/frontfarcorner.jpeg"
          title="front far corner"
        />
      </div>

      <div class="row">
        <img
          class="inactive-img"
          src="images/theater/pano.jpeg"
          title="panorama"
          style="height: 230px; margin-left: 200px"
        />
        <img
          class="inactive-img"
          src="images/theater/front.jpeg"
          title="front"
        />
      </div>

      <div class="row">
        <img
          class="inactive-img"
          src="images/theater/backrow.jpeg"
          style="position: relative; bottom: 60px; right: 70px"
          title="back row"
        />
        <a href="hallway.html">
          <img
            class="clickable-img"
            src="images/theater/otherdoor.jpeg"
            style="margin-left: -70px"
            title="other door"
          />
        </a>
        <a href="hallway.html">
          <img
            class="clickable-img"
            src="images/theater/door.jpeg"
            style="margin-left: 285px"
            title="back to hallway"
          />
        </a>
        <img
          class="inactive-img"
          src="images/theater/wirebox.jpeg"
          title="wire box"
        />
      </div>
    </div>
  </body>
</html>
