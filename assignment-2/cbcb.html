<!doctype html>
<html>
  <head>
    <title>cbcb</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="collage.css" />
  </head>
  <body>
    <div class="collage">
      <div class="side-left">
        <img
          class="inactive-img"
          src="images/cbcb/occupancy.jpeg"
          style="margin-right: 50px"
          title="occupancy permit"
        />
      </div>

      <div class="row">
        <img
          class="inactive-img"
          src="images/cbcb/farleftcorner.jpeg"
          title="far left corner"
        />
        <img
          class="inactive-img"
          src="images/cbcb/ceiling.jpeg"
          style="margin-left: 215px"
          title="ceiling"
        />
        <img
          class="inactive-img"
          src="images/cbcb/tablecloseup.jpeg"
          style="height: 120px; margin-left: 90px"
          title="table closeup"
        />
        <img
          class="inactive-img"
          src="images/cbcb/farrightcorner.jpeg"
          title="far right corner"
        />
      </div>

      <div class="row">
        <img class="inactive-img" src="images/cbcb/left.jpeg" title="left" />
        <img
          class="inactive-img"
          src="images/cbcb/pano.jpeg"
          title="panorama"
          style="height: 250px"
        />
        <img class="inactive-img" src="images/cbcb/right.jpeg" title="right" />
      </div>

      <div class="row">
        <img
          class="inactive-img"
          src="images/cbcb/nearleftcorner.jpeg"
          title="near left corner"
        />
        <img
          class="inactive-img"
          src="images/cbcb/lightswitch.jpeg"
          style="height: 120px; margin-left: 105px"
          title="light switch"
        />
        <a href="hallway.html">
          <img
            class="clickable-img"
            src="images/cbcb/door.jpeg"
            title="back to hallway"
          />
        </a>
        <img
          class="inactive-img"
          src="images/cbcb/nearrightcorner.jpeg"
          style="margin-left: 200px"
          title="near right corner"
        />
      </div>
    </div>
  </body>
</html>
